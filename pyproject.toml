[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frzspatial"
version = "0.1.2"
description = "CosMx (AtoMx) exports to SpatialData: fast loading, stitched cores, plots and napari annotation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "franzake" }]
requires-python = ">=3.12"  # spatialdata 0.8
keywords = ["spatial transcriptomics", "CosMx", "AtoMx", "SpatialData", "napari", "TMA"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "spatialdata>=0.8",
    "anndata",
    "dask",
    "geopandas",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
    "scipy",
    "shapely>=2",
    "tifffile",
    "tqdm",
    "zarr",
    # plots, napari (0.10 needs Qt >= 6.7, not PyQt5), H&E registration
    "spatialdata-plot",
    "matplotlib",
    "napari-spatialdata",
    "napari[pyqt5]>=0.6,<0.10; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "napari>=0.6,<0.10; sys_platform == 'linux' and platform_machine == 'aarch64'",  # PyQt5 has no ARM Linux wheels
    "scanpy",
    "scikit-image",
    # Intel Macs: numba 0.62 / llvmlite 0.45 are the last with x86_64 macOS wheels (Python <= 3.13); newer ones fail
    # to build
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
all = []  # everything is installed by default; kept so that "frzspatial[all]" still works
test = ["pytest"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
frzspatial = "frzspatial.cli:main"

[project.urls]
Homepage = "https://github.com/franzake/frzspatial"
Documentation = "https://franzake.github.io/frzspatial"
Issues = "https://github.com/franzake/frzspatial/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/frzspatial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
