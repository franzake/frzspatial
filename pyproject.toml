[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frzspatial"
version = "0.1.0"
description = "CosMx (AtoMx) exports to SpatialData: fast loading, TMA cores, QC, R tools and plots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "franzake" }]
requires-python = ">=3.12"  # spatialdata 0.8
keywords = ["spatial transcriptomics", "CosMx", "AtoMx", "SpatialData", "TMA"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "spatialdata>=0.8",
    "anndata",
    "dask",
    "geopandas",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
    "scipy",
    "shapely>=2",
    "tifffile",
    "tqdm",
    "zarr",
    # plots, clustering
    "spatialdata-plot",
    "matplotlib",
    "scanpy",
    "igraph",  # scanpy's Leiden clustering (flavor="igraph")
    "adjustText",  # labels on UMAPs
    "squidpy>=1.8",  # spatial graph, neighbourhood enrichment (spatial_neighbors_radius)
    # Intel Macs: numba 0.62 / llvmlite 0.45 are the last with x86_64 macOS wheels (Python <= 3.13); newer ones fail
    # to build
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
all = []  # everything is installed by default; kept so that "frzspatial[all]" still works
test = ["pytest"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/franzake/frzspatial"
Documentation = "https://franzake.github.io/frzspatial"
Issues = "https://github.com/franzake/frzspatial/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/frzspatial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
